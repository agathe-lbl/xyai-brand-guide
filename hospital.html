<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Do you see the difference? — XY.AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
  }

  .card {
    width: 1080px;
    height: 1080px;
    background: #ffffff;
    border: 2px solid #111;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 48px 24px;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }

  .top-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #999;
  }

  .wordmark {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #111;
  }

  /* ── HEADLINE ── */
  .headline-block {
    padding: 36px 64px 0;
    flex-shrink: 0;
  }

  .headline-q {
    font-size: 40px;
    font-weight: 900;
    color: #111;
    letter-spacing: -1px;
    line-height: 1.05;
  }

  .headline-a {
    font-size: 40px;
    font-weight: 900;
    color: #0A1F44;
    letter-spacing: -1px;
    line-height: 1.05;
    margin-top: 2px;
  }

  /* ── BUILDINGS AREA ── */
  .buildings {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 80px;
    padding: 20px 80px 0;
    position: relative;
  }

  /* Ground line */
  .buildings::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 64px;
    right: 64px;
    height: 1.5px;
    background: #ddd;
  }

  .building-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .building-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #bbb;
    margin-bottom: 12px;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    border-top: 1.5px solid #111;
    padding: 22px 48px 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .bottom-copy {
    font-size: 13px;
    line-height: 1.6;
    color: #888;
    max-width: 600px;
  }

  .xy-logo-text {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #111;
    text-align: right;
    flex-shrink: 0;
    margin-left: 32px;
  }
</style>
</head>
<body>
