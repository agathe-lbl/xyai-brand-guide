<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI-Native Leader — XY.AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
  }

  .card {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(135deg, #4B9EF5 0%, #7B6EF5 50%, #A855F7 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }

  .inner-frame {
    width: 100%;
    height: 100%;
    border: 10px solid rgba(10, 10, 40, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 60px 80px;
  }

  .main-text {
    font-size: 92px;
    font-weight: 900;
    color: #ffffff;
    text-align: center;
    line-height: 1.0;
    letter-spacing: -3px;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: rgba(255,255,255,0.4);
    margin: 52px auto;
    border-radius: 2px;
  }

  .secondary-text {
    font-size: 92px;
    font-weight: 900;
    color: rgba(255,255,255,0.92);
    text-align: center;
    line-height: 1.0;
    letter-spacing: -3px;
  }

  .wordmark {
    position: absolute;
    bottom: 28px;
    right: 36px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
<div class="card">
  <div class="inner-frame">
    <div class="main-text">Stop managing<br>people.</div>
    <div class="divider"></div>
    <div class="secondary-text">Start orchestrating<br>intelligence.</div>
    <div class="wordmark">XY.AI LABS</div>
  </div>
</div>
</body>
</html>
