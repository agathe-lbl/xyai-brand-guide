<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Token Maxing — XY.AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Maven Pro', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
    letter-spacing: -0.01em;
  }

  .card {
    width: 1080px;
    height: 1080px;
    background: #FFFFFF;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px 88px;
    overflow: hidden;
  }

  /* Subtle radial accent — top right corner */
  .card::before {
    content: '';
    position: absolute;
    top: -160px;
    right: -160px;
    width: 460px;
    height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFCC00 0%, #FF00D4 35%, #B377E8 65%, #EA580C 95%);
    filter: blur(1px);
    opacity: 0.85;
  }

  .card::after {
    content: '';
    position: absolute;
    top: -160px;
    right: -160px;
    width: 460px;
    height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle at 70% 70%, transparent 30%, rgba(255,255,255,0.6) 100%);
    pointer-events: none;
  }

  /* ── TOP ROW ── */
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    z-index: 2;
  }

  .wordmark {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #1C1917;
  }

  .wordmark-dot {
    color: #FFCC00;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(28, 25, 23, 0.45);
    text-align: right;
  }

  /* ── HERO HEADING ── */
  .heading {
    position: relative;
    z-index: 2;
    margin-top: 80px;
    margin-bottom: 80px;
  }

  .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #FF00D4;
    margin-bottom: 28px;
  }

  .headline {
    font-size: 116px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -4px;
    color: #1C1917;
    margin-bottom: 32px;
  }

  .headline .strike {
    color: rgba(28, 25, 23, 0.28);
    text-decoration: line-through;
    text-decoration-color: rgba(28, 25, 23, 0.35);
    text-decoration-thickness: 5px;
    font-weight: 800;
  }

  .headline .accent {
    background: linear-gradient(90deg, #FF00D4 0%, #B377E8 50%, #EA580C 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subhead {
    font-size: 23px;
    font-weight: 500;
    line-height: 1.4;
    color: rgba(28, 25, 23, 0.65);
    max-width: 740px;
    margin-top: 8px;
  }

  /* ── BOTTOM ROW ── */
  .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    position: relative;
    z-index: 2;
    border-top: 1px solid rgba(28, 25, 23, 0.12);
    padding-top: 28px;
  }

  .attr {
    font-size: 13px;
    color: rgba(28, 25, 23, 0.5);
    line-height: 1.5;
  }

  .attr strong {
    color: #1C1917;
    font-weight: 700;
    display: block;
    margin-bottom: 2px;
  }

  .compliance {
    font-size: 11px;
    font-weight: 600;
    color: rgba(28, 25, 23, 0.4);
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }

  .gradient-bar {
    width: 100px;
    height: 4px;
    background: linear-gradient(90deg, #FF00D4, #B377E8, #EA580C);
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="card">

  <!-- TOP -->
  <div class="top-row">
    <div class="wordmark">xy<span class="wordmark-dot">.</span>ai LABS</div>
    <div class="eyebrow">Token Maxing vs Compiled AI · 2026</div>
  </div>

  <!-- HEADING -->
  <div class="heading">
    <div class="label">The architecture choice</div>
    <div class="headline">
      <span class="strike">Token max.</span><br><span class="accent">Codify.</span>
    </div>
    <div class="subhead">
      Research is where you token max. Operations is where you codify. The architecture you pick is the bill.
    </div>
  </div>

  <!-- BOTTOM -->
  <div class="bottom-row">
    <div class="attr">
      <strong>Sam De Brouwer</strong>
      CEO, XY.AI Labs
    </div>
    <div style="text-align:right;">
      <div class="compliance">SOC 2 · HIPAA</div>
      <div class="gradient-bar" style="margin-left:auto;"></div>
    </div>
  </div>

</div>
</body>
</html>
